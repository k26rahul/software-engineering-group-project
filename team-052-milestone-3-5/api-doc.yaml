openapi: 3.1.0
info:
  title: Library Management System API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      description: 'Returns a simple liveness check response.


        ### User Story Mapping

        - INFRA-1.0: System health and liveness status check for uptime monitoring.'
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      x-user-story-ids:
      - INFRA-1.0
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: 'Authenticates a user and returns an access token.


        ### User Story Mapping

        - US-1.1: As a Librarian, I want to securely log in to the administrative
        dashboard, so that I can manage library operations without unauthorized access.

        - US-2.1: As a Member, I want to self-register and securely log in to access
        digital services and manage my account.'
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid email or password.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.1
      - US-2.1
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      description: 'Registers a new member account with pending approval and logs
        them in.


        ### User Story Mapping

        - US-2.1: As a Member, I want to self-register and securely log in to access
        digital services and manage my account.'
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '409':
          description: Email is already registered.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-2.1
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: 'Logs out the user by invalidating the active token.


        ### User Story Mapping

        - US-1.1: As a Librarian, I want to securely log in to the administrative
        dashboard, so that I can manage library operations without unauthorized access.

        - US-2.1: As a Member, I want to self-register and securely log in to access
        digital services and manage my account.'
      operationId: logout_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: Invalid, expired, or revoked token.
      security:
      - OAuth2PasswordBearer: []
      x-user-story-ids:
      - US-1.1
      - US-2.1
  /auth/change-password:
    post:
      tags:
      - Authentication
      summary: Change Password
      description: 'Changes the password of the currently authenticated user.


        ### User Story Mapping

        - US-2.1: As a Member, I want to self-register and securely log in to access
        digital services and manage my account.'
      operationId: change_password_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '401':
          description: Invalid, expired, or revoked token.
        '400':
          description: Current password is incorrect.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
      x-user-story-ids:
      - US-2.1
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Get Current User
      description: 'Retrieves the profile of the currently logged-in user.


        ### User Story Mapping

        - US-1.1: As a Librarian, I want to securely log in to the administrative
        dashboard, so that I can manage library operations without unauthorized access.

        - US-2.1: As a Member, I want to self-register and securely log in to access
        digital services and manage my account.'
      operationId: get_current_user_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Invalid, expired, or revoked token.
      security:
      - OAuth2PasswordBearer: []
      x-user-story-ids:
      - US-1.1
      - US-2.1
  /books:
    get:
      tags:
      - Books
      summary: List catalog books
      description: 'Retrieves a list of all books in the catalog, optionally filtered
        by search query or category.


        ### User Story Mapping

        - US-2.2: As a Member, I want to search the digital catalog using filters
        and view real-time book copy availability.

        - US-1.3: As a Librarian, I want to manage the book catalog (add/edit books,
        ISBN lookup, and physical copy statuses).'
      operationId: list_books_books_get
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term for title, author, or ISBN
          title: Query
        description: Search term for title, author, or ISBN
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by genre or category
          title: Category
        description: Filter by genre or category
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummaryResponse'
                title: Response List Books Books Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-2.2
      - US-1.3
    post:
      tags:
      - Books
      summary: Add a new book
      description: 'Librarian-only. Adds a new book to the library catalog with initial
        physical copies.


        ### User Story Mapping

        - US-1.3: As a Librarian, I want to manage the book catalog (add/edit books,
        ISBN lookup, and physical copy statuses).'
      operationId: create_book_books_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: copies
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Number of initial physical copies
          default: 1
          title: Copies
        description: Number of initial physical copies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBookRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '401':
          description: Invalid, expired, or revoked token.
        '403':
          description: Insufficient permissions. Librarian role required.
        '400':
          description: A book with the provided ISBN already exists.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.3
  /books/isbn-lookup:
    post:
      tags:
      - Books
      summary: Lookup book by ISBN
      description: 'Fetches book metadata from external ISBN database to auto-fill
        entry fields.


        ### User Story Mapping

        - US-1.3: As a Librarian, I want to manage the book catalog (add/edit books,
        ISBN lookup, and physical copy statuses).'
      operationId: isbn_lookup_books_isbn_lookup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ISBNLookupRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddBookRequest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.3
  /books/{id}:
    get:
      tags:
      - Books
      summary: Get book details
      description: 'Retrieves detailed information about a specific book including
        copy availability and ratings.


        ### User Story Mapping

        - US-2.2: As a Member, I want to search the digital catalog using filters
        and view real-time book copy availability.'
      operationId: get_book_books__id__get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '404':
          description: Requested resource not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-2.2
    patch:
      tags:
      - Books
      summary: Update book metadata
      description: 'Librarian-only. Updates metadata fields for an existing book.


        ### User Story Mapping

        - US-1.3: As a Librarian, I want to manage the book catalog (add/edit books,
        ISBN lookup, and physical copy statuses).'
      operationId: update_book_books__id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '401':
          description: Invalid, expired, or revoked token.
        '403':
          description: Insufficient permissions. Librarian role required.
        '404':
          description: Requested resource not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.3
  /books/{id}/copies/{copy_id}:
    patch:
      tags:
      - Books
      summary: Update book copy status
      description: 'Librarian-only. Updates physical copy status (e.g. AVAILABLE,
        ISSUED, DAMAGED, LOST).


        ### User Story Mapping

        - US-1.3: As a Librarian, I want to manage the book catalog (add/edit books,
        ISBN lookup, and physical copy statuses).'
      operationId: update_copy_status_books__id__copies__copy_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: copy_id
        in: path
        required: true
        schema:
          type: integer
          title: Copy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCopyStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '401':
          description: Invalid, expired, or revoked token.
        '403':
          description: Insufficient permissions. Librarian role required.
        '404':
          description: Requested resource not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.3
  /budget:
    get:
      tags:
      - Budget
      summary: Get budget summary
      description: 'Retrieve current budget utilization vs monthly limit.


        ### User Story Mapping

        - US-1.8: As a Librarian, I want to enter book purchases and track the monthly
        budget allowance.'
      operationId: get_budget_summary_budget_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSummaryResponse'
      x-user-story-ids:
      - US-1.8
  /budget/expenses:
    post:
      tags:
      - Budget
      summary: Record an expense
      description: 'Manually log a new expense (Librarian-only).


        ### User Story Mapping

        - US-1.8: As a Librarian, I want to enter book purchases and track the monthly
        budget allowance.'
      operationId: record_expense_budget_expenses_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPurchaseRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
      x-user-story-ids:
      - US-1.8
  /members:
    get:
      tags:
      - Members
      summary: List all members
      description: 'Librarian-only. Retrieves a list of members filtered by approval
        status or role.


        ### User Story Mapping

        - US-1.2: As a Librarian, I want to review and manage digital member registrations,
        profile details, and borrowing histories.'
      operationId: list_members_members_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: approval_status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MemberApprovalStatus'
          - type: 'null'
          description: Filter by member approval status
          title: Approval Status
        description: Filter by member approval status
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/UserRole'
          - type: 'null'
          description: Filter by user role
          title: Role
        description: Filter by user role
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberSummaryResponse'
                title: Response List Members Members Get
        '401':
          description: Invalid, expired, or revoked token.
        '403':
          description: Insufficient permissions. Librarian role required.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.2
  /members/{id}:
    get:
      tags:
      - Members
      summary: Get member details
      description: 'Retrieves the profile details of a specific member.


        ### User Story Mapping

        - US-1.2: As a Librarian, I want to review and manage digital member registrations,
        profile details, and borrowing histories.'
      operationId: get_member_members__id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetailResponse'
        '401':
          description: Invalid, expired, or revoked token.
        '404':
          description: Member not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.2
  /members/{id}/approve:
    patch:
      tags:
      - Members
      summary: Approve member registration
      description: 'Librarian-only. Approves a pending member registration and activates
        their account.


        ### User Story Mapping

        - US-1.2: As a Librarian, I want to review and manage digital member registrations,
        profile details, and borrowing histories.

        - US-2.1: As a Member, I want to self-register and securely log in to access
        digital services and manage my account.'
      operationId: approve_member_members__id__approve_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Invalid, expired, or revoked token.
        '403':
          description: Insufficient permissions. Librarian role required.
        '404':
          description: Member not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.2
      - US-2.1
  /members/{id}/reject:
    patch:
      tags:
      - Members
      summary: Reject member registration
      description: 'Librarian-only. Rejects a pending member registration.


        ### User Story Mapping

        - US-1.2: As a Librarian, I want to review and manage digital member registrations,
        profile details, and borrowing histories.'
      operationId: reject_member_members__id__reject_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Invalid, expired, or revoked token.
        '403':
          description: Insufficient permissions. Librarian role required.
        '404':
          description: Member not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.2
  /members/{id}/profile:
    patch:
      tags:
      - Members
      summary: Update member profile
      description: 'Updates a specific member''s profile details.


        ### User Story Mapping

        - US-1.2: As a Librarian, I want to review and manage digital member registrations,
        profile details, and borrowing histories.'
      operationId: update_profile_members__id__profile_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetailResponse'
        '401':
          description: Invalid, expired, or revoked token.
        '404':
          description: Member not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.2
  /members/{id}/history:
    get:
      tags:
      - Members
      summary: Get member borrowing history
      description: 'Retrieves the borrowing history for a specific member.


        ### User Story Mapping

        - US-1.2: As a Librarian, I want to review and manage digital member registrations,
        profile details, and borrowing histories.'
      operationId: get_member_history_members__id__history_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionHistoryItemResponse'
                title: Response Get Member History Members  Id  History Get
        '401':
          description: Invalid, expired, or revoked token.
        '404':
          description: Member not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-1.2
  /payments/fines:
    get:
      tags:
      - Payments
      summary: Get pending fines
      description: 'Retrieve pending (unpaid) fines for a member.


        ### User Story Mapping

        - US-2.7: As a Member, I want to pay membership renewal fees or outstanding
        fines and view payment history.'
      operationId: get_pending_fines_payments_fines_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FineResponse'
                type: array
                title: Response Get Pending Fines Payments Fines Get
      security:
      - OAuth2PasswordBearer: []
      x-user-story-ids:
      - US-2.7
  /payments/history:
    get:
      tags:
      - Payments
      summary: Get payment history
      description: 'Retrieves the complete payment history for a specific member.


        ### User Story Mapping

        - US-2.7: As a Member, I want to pay membership renewal fees or outstanding
        fines and view payment history.'
      operationId: get_payment_history_payments_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaymentResponse'
                type: array
                title: Response Get Payment History Payments History Get
      security:
      - OAuth2PasswordBearer: []
      x-user-story-ids:
      - US-2.7
  /payments/fines/{fine_id}:
    post:
      tags:
      - Payments
      summary: Process fine payment
      description: 'Processes payment for a specific fine.


        ### User Story Mapping

        - US-2.7: As a Member, I want to pay membership renewal fees or outstanding
        fines and view payment history.'
      operationId: pay_fine_payments_fines__fine_id__post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: fine_id
        in: path
        required: true
        schema:
          type: integer
          title: Fine Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-story-ids:
      - US-2.7
  /payments/membership-renewal:
    post:
      tags:
      - Payments
      summary: Process membership renewal payment
      description: 'Processes annual membership renewal fee payment.


        ### User Story Mapping

        - US-2.7: As a Member, I want to pay membership renewal fees or outstanding
        fines and view payment history.'
      operationId: pay_membership_renewal_payments_membership_renewal_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
      x-user-story-ids:
      - US-2.7
  /transactions/issue:
    post:
      tags:
      - Transactions
      summary: Issue a book
      description: 'Librarian-only. Issues an available book copy to an active member
        with a due date.


        ### User Story Mapping

        - US-1.4: As a Librarian, I want to digitally issue and return books, track
        overdue loans, and auto-calculate condition fines.

        - US-2.3: As a Member, I want to view my active borrowing dashboard with exact
        return deadlines and current issues.'
      operationId: issue_book_transactions_issue_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBookRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          description: Invalid, expired, or revoked token.
        '403':
          description: Insufficient permissions. Librarian role required.
        '400':
          description: Member is inactive/unapproved, or book copy is unavailable.
        '409':
          description: Member has reached their maximum borrowing limit.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
      x-user-story-ids:
      - US-1.4
      - US-2.3
  /transactions/return:
    post:
      tags:
